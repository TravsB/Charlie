openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: projects
    description: Authenticated project management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /readyz:
    get:
      operationId: readinessCheck
      tags: [health]
      summary: Readiness check
      description: Checks whether the API can reach its required PostgreSQL database
      responses:
        "200":
          description: API and database are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
        "503":
          description: A required dependency is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List the authenticated user's projects
      parameters:
        - name: status
          in: query
          required: false
          description: Defaults to active projects when omitted.
          schema:
            type: string
            enum: [active, archived, all]
      responses:
        "200":
          description: Projects owned by the authenticated user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
        "401":
          description: Authentication required
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project for the authenticated user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid project input
        "401":
          description: Authentication required
  /projects/{projectId}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get an owned project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The requested project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          description: Authentication required
        "404":
          description: Project not found
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update an owned active project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: Project updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid project input
        "401":
          description: Authentication required
        "404":
          description: Project not found
  /projects/{projectId}/archive:
    post:
      operationId: archiveProject
      tags: [projects]
      summary: Archive an owned project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The archived project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          description: Authentication required
        "404":
          description: Project not found
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ReadinessStatus:
      type: object
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        database:
          type: string
          enum: [ok, unavailable]
        checkedAt:
          type: string
          format: date-time
      required:
        - status
        - database
        - checkedAt
    CreateProjectRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 4000
          nullable: true
      required:
        - name
    UpdateProjectRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: ["string", "null"]
          maxLength: 4000
    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, archived]
        archivedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - description
        - status
        - archivedAt
        - createdAt
        - updatedAt

