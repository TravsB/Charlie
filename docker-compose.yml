services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:-nexus_ai_dev}
      POSTGRES_USER: ${PGUSER:-nexus_ai}
      POSTGRES_PASSWORD: ${PGPASSWORD:-nexus_ai_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - nexus-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${PGUSER:-nexus_ai} -d ${PGDATABASE:-nexus_ai_dev}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - nexus-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  nexus-postgres:
  nexus-redis:
